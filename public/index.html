function compareCard(p){let r=reportsFor(p.id)[0];return `<section class="comparison"><div class="player-top" style="margin-bottom:17px"><div class="avatar">${esc(initial(p))}</div><div><h3>${esc(p.name)}</h3><div class="sub">${esc(p.club)} · ${esc(prettyPosition(p.position))}</div></div></div><div class="chips">${badge(p)}<span class="chip">Age ${p.age==null?'—':p.age}</span></div><div class="statsline"><div class="stat"><b>${p.goals??'—'}</b><span>Goals</span></div><div class="stat"><b>${p.assists??'—'}</b><span>Assists</span></div><div class="stat"><b>${p.cleansheets??'—'}</b><span>CS*</span></div></div><p class="dated">Source period: <strong>${esc(p.period||'Not provided')}</strong></p>${p.context?`<p class="source-note">${esc(p.context)}</p>`:''}<hr class="rule"/><div class="eyebrow">Latest personal assessment</div>${FIELDS.map(f=>{let v=Number(r?.ratings?.[f])||0;return `<div class="barline"><div class="barlabel"><span>${f}</span><span>${v?v+'/5':'Not rated'}</span></div><div class="bartrack"><div class="barfill" style="width:${v*20}%"></div></div></div>`}).join('')}<div class="dated" style="margin-top:15px">${r?.date?'Assessment: '+shortDate(r.date):'No scout report yet'}</div><button class="primary small" data-action="details" data-id="${esc(p.id)}">Open profile →</button></section>`}

function renderReports(){let reps=[...data.reports].sort((a,b)=>b.created.localeCompare(a.created));return pageHeading('Scouting reports','Every opinion should be grounded in a match, video or training observation you actually made.')+`<div class="sectionbar"><h2>${reps.length} saved ${reps.length===1?'report':'reports'}</h2><div class="inline-actions"><button class="secondary small" data-action="export-csv">Export CSV</button><button class="primary small" data-action="new-report">+ New report</button></div></div>${!reps.length?panelEmpty('Start your scouting notebook','Open a player profile and write down a real observation. You can score five dimensions and build a history of reports.',`<button class="primary" data-action="go" data-page="discover">Browse prospects →</button>`):reps.map(r=>{let p=byId(r.playerId),a=average(r);return `<article class="reportcard"><div><div class="chips" style="margin:0 0 10px"><span class="chip">${esc(r.method||'Observation')}</span><span class="chip">${esc(shortDate(r.date))}</span></div><h3>${esc(p?.name||'Deleted player')}</h3><div class="reportmeta">${esc(p?.club||'')} ${r.fixture?' · '+esc(r.fixture):''}</div>${r.strengths?`<p class="reportnotes"><strong>Strengths:</strong> ${esc(r.strengths)}</p>`:''}${r.development?`<p class="reportnotes"><strong>Development:</strong> ${esc(r.development)}</p>`:''}${r.notes?`<p class="reportnotes"><strong>Notes:</strong> ${esc(r.notes)}</p>`:''}<div class="inline-actions" style="margin-top:11px"><button class="secondary small" data-action="details" data-id="${esc(r.playerId)}">Player profile</button><button class="secondary small" data-action="share-report" data-id="${esc(r.id)}">↗ WhatsApp report</button><button class="ghost small danger" data-action="delete-report" data-id="${esc(r.id)}">Delete</button></div></div><div>${a?`<div class="badge-rating">${a} / 5</div>`:'<span class="chip">Unrated</span>'}</div></article>`}).join('')}`}
function renderSettings(){return pageHeading('Your scouting data','Offline notes are private to this browser. Shared reports are only uploaded after you explicitly publish them to your private team.')+`<div class="settings-grid"><section class="panel"><h3>Back up your scouting work</h3><p>Download your own prospects, watchlist and reports as a JSON file. Restore them later in another browser or device.</p><button class="primary small" data-action="export-json">Download backup</button><button class="secondary small" data-action="import-json">Restore backup</button><input class="hidden" type="file" id="import-file" accept="application/json,.json"/></section><section class="panel"><h3>Export readable reports</h3><p>Export your scouting reports and selected player fields in CSV format for Excel or sharing. This export can include your personal notes.</p><button class="secondary small" data-action="export-csv">Download CSV</button></section><section class="panel"><h3>How the data works</h3><p>Official sources are linked on each verified player profile. Ages and goals/assists are as published for the listed award period. They are not guaranteed to be current today.</p><a href="${SRC_AUG}" target="_blank" rel="noopener noreferrer">August 2026 official shortlist ↗</a><br/><a href="${SRC_SEP}" target="_blank" rel="noopener noreferrer">September 2026 official shortlist ↗</a><br/><a href="${SRC_FEB}" target="_blank" rel="noopener noreferrer">February 2026 official shortlist ↗</a></section><section class="panel"><h3>Safeguarding & privacy</h3><p>Some prospects are under 18. Keep notes professional and football-related. Do not record children's private phone numbers, home addresses or school details. Seek relevant permission for filming or sharing youth match content.</p><p>This app does not contact players, verify eligibility, predict contracts or provide recruitment access.</p></section><section class="panel"><h3>Storage and reset</h3><p>Your changes stay in this browser. Clearing browser storage, uninstalling or switching phones can delete them. Export backups regularly.</p><button class="secondary small danger" data-action="reset-all">Erase my saved scouting data</button></section><section class="panel"><h3>Version 7 · October 2026</h3><p>Features: curated EFL, non-league and PL2 scouting leads, viewing-stage tracker and planned follow-ups, reports, five-dimension ratings, comparisons, JSON backup and CSV export.</p><p>WhatsApp sharing works for individual reports, watchlists and comparisons. No live player data feed or automatic player updates are claimed. Team accounts and private publishing are available once you connect a dedicated online database and publish to HTTPS.</p></section></div>`}

function showPlayer(id){let p=byId(id);if(!p)return;let list=reportsFor(id);let watch=data.watch.includes(id);openModal(`<div class="modalhead"><div class="modalplayer"><div class="avatar">${esc(initial(p))}</div><div><div class="eyebrow">Player profile</div><h2>${esc(p.name)}</h2><div class="sub">${esc(p.club)} · ${esc(prettyPosition(p.position))} · Age ${p.age==null?'not recorded':esc(p.age)}</div></div></div><button class="close" data-action="close-modal" aria-label="Close">×</button></div><div class="chips" style="margin:0 0 12px">${badge(p)}<span class="chip">${esc(p.period||'No period')}</span><span class="chip">${esc(p.season||'My player')}</span></div>${p.previousClub?`<p class="transfer-note">Previously: <b>${esc(p.previousClub)}</b></p>`:''}<div class="statrow"><div class="stat"><b>${p.goals??'—'}</b><span>Goals</span></div><div class="stat"><b>${p.assists??'—'}</b><span>Assists</span></div><div class="stat"><b>${p.cleansheets??'—'}</b><span>Clean sheets*</span></div></div><div class="modalbody">${p.seed?`<p><strong>${esc(p.honour||'Source-verified player profile')}</strong></p><p>${esc(p.context||'Published performance evidence. Check source period before comparing players.')}</p><p>Competition: <strong>${esc(TIERS.find(x=>x[0]===p.league)?.[1]||p.league||'Unspecified')}</strong>. Verification snapshot: <strong>${esc(p.verifiedAt||'2026-10-16')}</strong>. This is not live data or an official ability score.</p><a href="${url(p.source)}" target="_blank" rel="noopener noreferrer">Read player source ↗</a>`:`<p>This player was entered by you. The app has not independently verified their details or performance data.</p>${p.source?`<a href="${url(p.source)}" target="_blank" rel="noopener noreferrer">Open saved source ↗</a>`:''}`}</div>${watch?`<div class="viewplan"><div class="inline-actions"><b>Viewing plan</b>${stagePill(id)}</div><p>${esc(dueLabel(scoutingPlan(id).nextDate))}</p>${scoutingPlan(id).focus?`<p>Next focus: ${esc(scoutingPlan(id).focus)}</p>`:""}<button class="secondary small" data-action="plan" data-id="${esc(id)}">Edit viewing plan</button></div>`:""}<hr class="rule"/><div class="split-header"><h3 style="margin:0;font-family:var(--heading)">Your scouting history (${list.length})</h3><button class="secondary small" data-action="write-report" data-id="${esc(p.id)}">+ Write report</button></div>${list.length?list.slice(0,5).map(r=>`<div class="tl"><strong>${esc(shortDate(r.date))} · ${esc(r.method)} ${average(r)?' · '+average(r)+'/5':''}</strong>${r.fixture?`<p>${esc(r.fixture)}</p>`:''}${r.notes?`<p>${esc(r.notes)}</p>`:''}${r.strengths?`<p><b>Strengths:</b> ${esc(r.strengths)}</p>`:''}</div>`).join(''):'<p class="formhint">No personal assessments yet. Your observation matters more than a stat line.</p>'}<div class="modalactions"><button class="secondary" data-action="watch-toggle" data-id="${esc(p.id)}">${watch?'★ Remove from watchlist':'☆ Add to watchlist'}</button>${watch?`<button class="secondary" data-action="plan" data-id="${esc(p.id)}">Plan next viewing</button>`:""}<button class="primary" data-action="write-report" data-id="${esc(p.id)}">Write scout report →</button></div>`)}
function newPlayerModal(){openModal(`<div class="modalhead"><div><div class="eyebrow">Your scouting leads</div><h2>Add a player</h2></div><button class="close" data-action="close-modal" aria-label="Close">×</button></div><p class="formhint">Add a player you genuinely want to assess. No invented or default scouting ratings. Only add publicly known football information.</p><form id="new-player-form"><div class="formrow"><div class="field"><label for="new-name">Player name *</label><input id="new-name" name="name" required maxlength="100" placeholder="Full name"/></div><div class="field"><label for="new-club">Current club *</label><input id="new-club" name="club" required maxlength="100" placeholder="Club"/></div></div><div class="formrow"><div class="field"><label for="new-age">Age (optional)</label><input id="new-age" name="age" type="number" min="10" max="45" placeholder="e.g. 22"/></div><div class="field"><label for="new-position">Position</label><select id="new-position" name="position"><option value="FWD">Forward</option><option value="MID">Midfielder</option><option value="DEF">Defender</option><option value="GKP">Goalkeeper</option></select></div></div><div class="formrow"><div class="field"><label for="new-league">Playing level</label><select name="league" id="new-league">${TIERS.map(([v,t])=>`<option value="${v}">${t}</option>`).join('')}</select></div><div class="field"><label for="new-previous">Previous or parent club (optional)</label><input name="previousClub" id="new-previous" maxlength="100" placeholder="e.g. Grimsby Town"/></div></div><div class="field"><label for="new-source">Public source URL (optional)</label><input id="new-source" name="source" type="url" placeholder="https://…"/></div><p class="formhint">Published results are left blank for your own entries, unless independently verified. Record match observations in a scouting report.</p><div class="modalactions"><button type="button" class="secondary" data-action="close-modal">Cancel</button><button type="submit" class="primary">Save player</button></div></form>`)}
function writeReportModal(id){let p=byId(id);let options=players().sort((a,b)=>a.name.localeCompare(b.name));let now=new Date();let today=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0');openModal(`<div class="modalhead"><div><div class="eyebrow">Observation notebook</div><h2>New scouting report</h2></div><button class="close" data-action="close-modal" aria-label="Close">×</button></div><p class="formhint">Assess only what you actually observed. Ratings are subjective, optional and scored from 1 (developing) to 5 (exceptional for this context).</p><form id="new-report-form"><div class="formrow"><div class="field"><label for="rep-player">Player *</label><select name="playerId" id="rep-player" required>${options.map(p=>`<option value="${esc(p.id)}" ${p.id===id?'selected':''}>${esc(p.name)} (${esc(p.club)})</option>`).join('')}</select></div><div class="field"><label for="rep-date">Observed date *</label><input name="date" type="date" id="rep-date" value="${today}" required/></div></div><div class="formrow"><div class="field"><label for="rep-method">Evidence type</label><select id="rep-method" name="method"><option>Live match</option><option>Full match video</option><option>Highlight footage</option><option>Training session</option><option>Other observation</option></select></div><div class="field"><label for="rep-fixture">Fixture / context</label><input id="rep-fixture" name="fixture" maxlength="150" placeholder="e.g. U21s v opposition"/></div></div><div class="field"><label for="rep-mins">Minutes observed (optional)</label><input id="rep-mins" name="minutes" type="number" min="1" max="150" placeholder="e.g. 90"/></div><h3 style="font-family:var(--heading);margin:15px 0 6px">Your assessment</h3><div class="rating-grid">${FIELDS.map(f=>`<div class="field"><label>${f}</label><select name="rating_${f}"><option value="">Not assessed</option>${[1,2,3,4,5].map(n=>`<option value="${n}">${n} / 5</option>`).join('')}</select></div>`).join('')}</div><div class="field" style="margin-top:15px"><label>Key strengths</label><textarea name="strengths" maxlength="1800" placeholder="Specific football actions or decisions observed…"></textarea></div><div class="field"><label>Areas to develop</label><textarea name="development" maxlength="1800" placeholder="Evidence-led development points…"></textarea></div><div class="field"><label>Additional notes / recommended next step</label><textarea name="notes" maxlength="2500" placeholder="Context, reliability, next viewing…"></textarea></div><div class="modalactions"><button type="button" class="secondary" data-action="close-modal">Cancel</button><button type="submit" class="primary">Save report</button></div></form>`)}
function download(name,content,mime){let blob=new Blob([content],{type:mime});let a=document.createElement('a'),obj=URL.createObjectURL(blob);a.href=obj;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(obj),30000)}
function csvValue(v){let s=String(v??'');if(/^[=+@-]/.test(s.trimStart()))s="'"+s;return '"'+s.replaceAll('"','""')+'"'}
function exportCSV(){let rows=[['Player','Current club','Former / parent club','Current league','Position','Age at source','Stats period','Published goals','Published assists','Published clean sheets','On watchlist','Scouting stage','Next viewing date','Next viewing focus','Observed date','Observation method','Fixture','Minutes observed',...FIELDS,'Assessment average (out of 5)','Strengths','Development points','Notes','Source URL']];for(let p of players()){let reps=reportsFor(p.id);for(let r of (reps.length?reps:[null]))rows.push([p.name,p.club,p.previousClub,p.league||'OTHER',p.position,p.age,p.period,p.goals,p.assists,p.cleansheets,data.watch.includes(p.id)?'Yes':'No',data.watch.includes(p.id)?stageLabel(scoutingPlan(p.id).stage):'',data.watch.includes(p.id)?scoutingPlan(p.id).nextDate:'',data.watch.includes(p.id)?scoutingPlan(p.id).focus:'',r?.date,r?.method,r?.fixture,r?.minutes,...FIELDS.map(f=>r?.ratings?.[f]),r?average(r):'',r?.strengths,r?.development,r?.notes,p.source])}download('scoutline-scouting-export.csv','\ufeff'+rows.map(r=>r.map(csvValue).join(',')).join('\r\n'),'text/csv;charset=utf-8');toast('CSV exported')}
function resetFilters(){query={search:'',position:'all',club:'all',period:'all',league:'all',sort:'recent'};render()}
function toggleWatch(id){if(data.watch.includes(id))data.watch=data.watch.filter(x=>x!==id);else data.watch.push(id);save();render();if(document.querySelector('#modal-root .modal')&&byId(id))showPlayer(id)}
function toggleCompare(id,checked){if(checked&&!data.selected.includes(id)){if(data.selected.length>=3){toast('Choose up to 3 players to compare');render();return}data.selected.push(id)}else if(!checked)data.selected=data.selected.filter(x=>x!==id);save();render()}
function reportToBackup(){return {format:'scoutline-v1',exportedAt:new Date().toISOString(),custom:data.custom,reports:data.reports,watch:data.watch,selected:data.selected,plan:data.plan||{}}}
function parseBackup(t){let v=JSON.parse(t);if(v.format!=='scoutline-v1'||!Array.isArray(v.custom)||!Array.isArray(v.reports)||!Array.isArray(v.watch))throw new Error('Not a Scoutline backup');if(v.custom.length>2000||v.reports.length>10000)throw new Error('File too large');let validCustom=v.custom.filter(x=>x&&typeof x.id==='string'&&typeof x.name==='string'&&typeof x.club==='string').map(x=>({id:x.id.slice(0,150),name:x.name.slice(0,100),club:x.club.slice(0,100),age:Number.isInteger(x.age)?x.age:null,position:['FWD','MID','DEF','GKP'].includes(x.position)?x.position:'MID',goals:null,assists:null,cleansheets:null,period:null,source:url(x.source)==='#'?'':url(x.source),honour:'Added by you',season:'Manual',league:TIERS.some(y=>y[0]===x.league)?x.league:'OTHER',previousClub:String(x.previousClub||'').slice(0,100),seed:false}));let ids=new Set([...SENIOR,...SEED,...validCustom].map(x=>x.id));let validReports=v.reports.filter(r=>r&&typeof r.id==='string'&&ids.has(r.playerId)).map(r=>({id:r.id.slice(0,150),playerId:r.playerId,created:String(r.created||'').slice(0,50),date:String(r.date||'').slice(0,10),method:String(r.method||'Observation').slice(0,50),fixture:String(r.fixture||'').slice(0,150),minutes:r.minutes==null?null:Number(r.minutes),ratings:Object.fromEntries(FIELDS.map(f=>[f,[1,2,3,4,5].includes(Number(r.ratings?.[f]))?Number(r.ratings[f]):null])),strengths:String(r.strengths||'').slice(0,1800),development:String(r.development||'').slice(0,1800),notes:String(r.notes||'').slice(0,2500)}));let plan={};if(v.plan&&typeof v.plan==='object'&&!Array.isArray(v.plan))for(const [id,x] of Object.entries(v.plan)){if(ids.has(id)&&x&&typeof x==='object'&&!Array.isArray(x)){plan[id]={stage:STAGES.some(s=>s[0]===x.stage)?x.stage:'to-watch',nextDate:/^\d{4}-\d{2}-\d{2}$/.test(String(x.nextDate||''))?String(x.nextDate):'',focus:String(x.focus||'').slice(0,600),updatedAt:String(x.updatedAt||'').slice(0,35)}}}return {custom:validCustom,reports:validReports,watch:v.watch.filter(id=>ids.has(id)),selected:(Array.isArray(v.selected)?v.selected:[]).filter(id=>ids.has(id)).slice(0,3),plan}}
document.addEventListener('click',e=>{let b=e.target.closest('[data-action]');if(!b)return;let action=b.dataset.action,id=b.dataset.id;if(action==='close-backdrop'){if(e.target===b)closeModal();return}if(b.tagName!=='INPUT')e.preventDefault();if(action==='go'){closeModal();go(b.dataset.page);return}if(action==='level-quick'){query.league=b.dataset.level;render();return}if(['team-signout','team-refresh','team-new-invite','team-copy-invite','team-whatsapp-invite','team-publish','team-stop-sync','team-restore','team-import-offline','team-share-link','team-check-connection'].includes(action)){teamAction(()=>handleTeamClick(action,id,b));return}if(action==='close-modal'){closeModal();return}if(action==='new-player'){newPlayerModal();return}if(action==='details'){showPlayer(id);return}if(action==='plan'){viewingPlanModal(id);return}if(action==='watch-toggle'){toggleWatch(id);return}if(action==='compare-toggle'){return}if(action==='write-report'){writeReportModal(id);return}if(action==='new-report'){writeReportModal('');return}if(action==='reset-filters'){resetFilters();return}if(action==='clear-compare'){data.selected=[];save();render();toast('Comparison cleared');return}if(action==='share-report'){shareScoutingReport(id);return}if(action==='share-watchlist'){shareScoutingWatchlist();return}if(action==='share-comparison'){shareComparison();return}if(action==='export-csv'){exportCSV();return}if(action==='export-json'){download('scoutline-backup-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify(reportToBackup(),null,2),'application/json');toast('Backup downloaded');return}if(action==='import-json'){document.getElementById('import-file')?.click();return}if(action==='delete-report'){if(confirm('Delete this scouting report? This cannot be undone.')){data.reports=data.reports.filter(r=>r.id!==id);save();render();toast('Report deleted')}return}if(action==='reset-all'){if(confirm('Erase all your added players, watchlist and scouting reports on this device? Please export a backup first.')){if(confirm('Confirm permanent erase of your local scouting data?')){data={custom:[],reports:[],watch:[],selected:[],plan:{}};if(cloud.syncEnabled&&cloud.user&&cloud.team){cloud.syncEnabled=false;localStorage.removeItem('scoutline_published_'+cloud.user.id+'_'+cloud.team.id)}save();render();toast('Local notes cleared. Previously published reports remain available to the team.')}}return}});

// If the Neon SDK token helper fails, request the documented Better Auth JWT endpoint.
// No database secrets or session tokens are stored in source code or displayed in errors.
async function getTeamJWT(){
 let primary='';
 try{let token=await cloud.auth.getJWTToken?.();if(typeof token==='string' && token.length>50)return token;primary='SDK returned no authentication token'}
 catch(e){primary=String(e?.message||e||'SDK unavailable').slice(0,110)}
 let response;
 try{response=await fetch(NEON_AUTH_URL+'/token',{method:'GET',credentials:'include',headers:{'Accept':'application/json'}})}
 catch(e){throw new Error('JWT token request failed: '+(e?.message||'Network error')+' (SDK: '+primary+')')}
 let result=null;try{result=await response.json()}catch{}
 if(!response.ok)throw new Error('JWT token endpoint HTTP '+response.status+(result?.message?': '+String(result.message).slice(0,130):'')+' (SDK: '+primary+')');
 if(typeof result?.token!=='string'||result.token.length<50)throw new Error('JWT token endpoint did not return a valid token');
 return result.token;
}
async function cloudRequest(path,method='GET',value,extra={}){

 let jwt;try{jwt=await getTeamJWT()}catch(e){throw new Error('Authentication token: '+e.message)}
 let endpoint=path.replace(/^\/rest\/v1/,'');
 let url=NEON_DATA_URL+endpoint;
 let headers={'Authorization':'Bearer '+jwt,'Content-Type':'application/json','Accept':'application/json',...(method==='POST'?{'Prefer':'return=representation'}:{}),...extra};
 let r;try{r=await fetch(url,{method,headers,body:value===undefined?undefined:JSON.stringify(value)})}
 catch(e){throw new Error('Data API network: '+(e?.message||'Network error'))}
 let t=await r.text();let v=t?(()=>{try{return JSON.parse(t)}catch{return t}})():null;
 if(!r.ok){let message=String(v?.message||v?.error||v?.hint||typeof v==='string'&&v.slice(0,130)||'');let code=v?.code?' ['+v.code+']':'';throw new Error('Data API '+r.status+' '+endpoint.split('?')[0]+code+(message?': '+message.slice(0,150):''))}
 return v;
}

  await publishMyData();cloud.syncEnabled=true;localStorage.setItem('scoutline_published_'+cloud.user.id+'_'+cloud.team.id,'yes');toast('Your scouting work was shared');return;
 }
 if(action==='team-stop-sync'){cloud.syncEnabled=false;localStorage.removeItem('scoutline_published_'+cloud.user.id+'_'+cloud.team.id);toast('New changes are private. Existing published reports remain shared.');return}
 if(action==='team-restore'){
  let snapshot=cloud.snapshots.find(v=>v.user_id===cloud.user.id);if(!snapshot)throw new Error('No cloud backup exists for this account');if(!confirm('Replace local scouting notes with your last published copy? Export a backup first if needed.'))return;
  let raw=snapshot.payload||{};data=parseBackup(JSON.stringify({format:'scoutline-v1',custom:raw.custom||[],reports:raw.reports||[],watch:raw.watch||[],selected:[]}));save();toast('Your notes were restored');return;
 }
 if(action==='team-import-offline'){
  if(!cloud.user||!offlineNotebooksAvailable())return;
  if(!confirm('Copy the original offline notebook into this signed-in account? Its existing local notes will be replaced. Nothing is published until you choose to share.'))return;
  let raw=JSON.parse(localStorage.getItem(KEY));data=parseBackup(JSON.stringify({...raw,format:'scoutline-v1'}));save();localStorage.setItem('scoutline_offline_imported_'+cloud.user.id,'yes');toast('Offline notes copied privately');return;
 }
 if(action==='team-share-link'){teamShare();return}
}


// Share only the report or player names the scout explicitly chooses, never the full database.
// Recipient selects the chat inside WhatsApp; the app does not contact anyone itself.
function shareWhatsAppText(message){
 const target='https://wa.me/?text='+encodeURIComponent(message);
 window.open(target,'_blank','noopener,noreferrer');
}
function scoutDisplayName(){return cloud.user?.email?cloud.user.email.split('@')[0]:'Scoutline scout'}
function shareScoutingReport(id){
 const r=data.reports.find(x=>x.id===id);if(!r){toast('Scouting report no longer exists');return;}
 const p=byId(r.playerId);if(!p){toast('Player is no longer available');return;}
 if(!confirm('Share this scouting report and its notes outside the private app on WhatsApp?'))return;
 let lines=['⚽ SCOUTLINE · SCOUTING REPORT',p.name+' · '+p.club+' · '+prettyPosition(p.position),'Observed: '+shortDate(r.date),'Evidence: '+(r.method||'Observation')];
 if(r.fixture)lines.push('Context: '+r.fixture);
 if(r.minutes)lines.push('Minutes observed: '+r.minutes);
 let score=average(r);if(score)lines.push('Scout assessment: '+score+'/5');
 let ratings=FIELDS.filter(f=>[1,2,3,4,5].includes(Number(r.ratings?.[f]))).map(f=>f+' '+r.ratings[f]+'/5');
 if(ratings.length)lines.push('Ratings: '+ratings.join(' · '));
 if(r.strengths)lines.push('Strengths: '+r.strengths);
 if(r.development)lines.push('Development: '+r.development);
 if(r.notes)lines.push('Additional notes: '+r.notes);
 lines.push('—','Scoutline · Independent scouting opinion, not an official player rating.');
 shareWhatsAppText(lines.join('\n'));
}
function shareScoutingWatchlist(){
 const list=data.watch.map(byId).filter(Boolean);if(!list.length){toast('Add players to your watchlist first');return;}
 const lines=['⚽ SCOUTLINE · MY FOOTBALL WATCHLIST',''];
 list.forEach((p,i)=>{let pl=scoutingPlan(p.id);lines.push((i+1)+'. '+p.name+' — '+p.club+' ('+prettyPosition(p.position)+') · '+stageLabel(pl.stage)+(pl.nextDate?' · Next view: '+pl.nextDate:''));});
 lines.push('','Saved by a scout on Scoutline. Names are scouting leads, not talent rankings.');
 shareWhatsAppText(lines.join('\n'));
}
function shareComparison(){
 const list=data.selected.map(byId).filter(Boolean);if(list.length<2){toast('Choose two or three players');return;}
 if(!confirm('Share your personal scouting assessment scores with a WhatsApp contact?'))return;
 const lines=['⚽ SCOUTLINE · PLAYER COMPARISON',''];
 list.forEach((p,i)=>{
   let r=reportsFor(p.id)[0];lines.push((i+1)+'. '+p.name+' — '+p.club);
   lines.push('Position: '+prettyPosition(p.position)+' · Scout rating: '+(r&&average(r)?average(r)+'/5':'Not assessed'));
   if(p.seed)lines.push('Official PL2 period: '+(p.period||'Unknown')+' (not directly comparable across periods)');
   lines.push('');
 });
 lines.push('Scoutline · Personal assessments only. No automated talent score.');
 shareWhatsAppText(lines.join('\n'));
}
